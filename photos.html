<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories 💗</title>

<style>
body{
    margin:0;
    background:#ffb6c1;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    color:white;
    margin:20px;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.gallery img{
    width:280px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
    transition:.4s;
}

.gallery img:hover{
    transform:scale(1.08);
}

p{
    color:white;
    font-size:24px;
    font-weight:bold;
    margin-bottom:30px;
}
</style>

</head>
<body>

<h1>Our Beautiful Memories 💗</h1>

<div class="gallery">
<img src="sanu1.jpg">
<img src="sanu2.jpg">
<img src="sanu3.jpg">
<img src="sanu4.jpg">
<img src="sanu5.jpg">
</div>

<p>🎂 Happy Birthday Sanu 💖</p>

</body>
</html>
